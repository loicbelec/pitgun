[package]
name = "pitgun-source-physics-wasm"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
pitgun-core = { path = "../pitgun-core" }
pitgun-contract = { path = "../pitgun-contract" }
pitgun-signing = { path = "../pitgun-signing" }
pitgun-source-physics = { path = "../pitgun-source-physics" }
