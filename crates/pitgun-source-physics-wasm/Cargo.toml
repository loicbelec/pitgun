[package]
name = "pitgun-source-physics-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pitgun-source-physics = { path = "../pitgun-source-physics" }
pitgun-contract = { path = "../pitgun-contract" }
pitgun-codec-json = { path = "../pitgun-codec-json" }

[dev-dependencies]
wasm-bindgen-test = "0.3"
