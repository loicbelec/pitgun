name: build-authority

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "services/pitgun-authority/**"
      - "crates/pitgun-contract/**"
      - "crates/pitgun-signing/**"
      - "crates/pitgun-policy/**"
      - "crates/pitgun-racing-contract/**"
      - "crates/pitgun-racing-policy/**"
      - "crates/pitgun-racing-simulator/**"
      - "crates/pitgun-racing-solver/**"
      - "crates/pitgun-runtime/**"
      - "crates/pitgun-core/**"
      - "policies/**"
      - "catalogs/racing/**"
      - ".github/workflows/build-authority.yml"
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "services/pitgun-authority/**"
      - "crates/pitgun-contract/**"
      - "crates/pitgun-signing/**"
      - "crates/pitgun-policy/**"
      - "crates/pitgun-racing-contract/**"
      - "crates/pitgun-racing-policy/**"
      - "crates/pitgun-racing-simulator/**"
      - "crates/pitgun-racing-solver/**"
      - "crates/pitgun-runtime/**"
      - "crates/pitgun-core/**"
      - "policies/**"
      - "catalogs/racing/**"
      - ".github/workflows/build-authority.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pitgun-authority
  LOCAL_IMAGE: pitgun-authority:pr-${{ github.sha }}

jobs:
  build-authority-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "image_tag=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build authority image for PR validation
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/pitgun-authority/Dockerfile
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            RUST_VERSION=1.89
          cache-from: type=gha,scope=pitgun-authority
          cache-to: type=gha,mode=max,scope=pitgun-authority

      - name: Smoke-test authority image
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs pitgun-authority-smoke || true; docker rm -f pitgun-authority-smoke || true; rm -f /tmp/pitgun-authority-signing-secret' EXIT
          umask 077
          printf '%s' 'ci-only-authority-smoke-secret' > /tmp/pitgun-authority-signing-secret
          chmod 0444 /tmp/pitgun-authority-signing-secret
          docker run --detach \
            --name pitgun-authority-smoke \
            --publish 127.0.0.1:18080:8080 \
            --volume /tmp/pitgun-authority-signing-secret:/run/secrets/pitgun_authority_signing_secret:ro \
            --env PITGUN_SIGNING_SECRET_FILE=/run/secrets/pitgun_authority_signing_secret \
            --env PITGUN_SIGNING_KEY_ID=ci-smoke \
            --env PITGUN_RACING_MODEL_VERSION=0.11.0 \
            --env PITGUN_RACING_CATALOG_RELEASE_DIR=/opt/pitgun/catalogs/racing/v1.7.0 \
            "${LOCAL_IMAGE}"

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "Authority did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null

          curl --fail --silent --show-error \
            --request POST http://127.0.0.1:18080/v1/authorizations/racing \
            --header "content-type: application/json" \
            --data '{
              "subject": "ci-smoke",
              "seed": "42",
              "catalog_release": {
                "schema_version": "pitgun.catalog-release-identity/v1",
                "id": "pitgun.racing",
                "version": "1.7.0",
                "manifest_digest": "sha256:bf6bd0337f04564a75893496aa87c7679966f4516938882724b5e9219897062b"
              },
              "input": {
                "track_id": "LASVEGAS",
                "laps": 1,
                "competitors": [],
                "vehicle_id": "f1_2026",
                "era": 2,
                "hz": 20
              }
            }' \
            --output /tmp/authority-response.json

          grep --fixed-strings \
            '"id":"pitgun.racing.simulation","version":"1.7.0","digest":"sha256:f93d09bbb2068fbd9f2a4718a6c57746934f015381cf7af0c25f190cc08d62b6"' \
            /tmp/authority-response.json
          grep --fixed-strings \
            '"id":"pitgun.racing-v3-candidate","version":"0.11.0","digest":"sha256:299ed6723fea676f431da80d59f3633e67eed252b6d34a2c737f067529aa6892"' \
            /tmp/authority-response.json

          curl --fail --silent --show-error \
            --request POST http://127.0.0.1:18080/v1/authorizations/racing/attempts \
            --header "content-type: application/json" \
            --data '{
              "subject": "ci-smoke",
              "execution_id": "018f3b78-7e9a-7d20-a5e1-4ed92f02a591",
              "seed": "42",
              "catalog_release": {
                "schema_version": "pitgun.catalog-release-identity/v1",
                "id": "pitgun.racing",
                "version": "1.7.0",
                "manifest_digest": "sha256:bf6bd0337f04564a75893496aa87c7679966f4516938882724b5e9219897062b"
              },
              "input": {
                "track_id": "LASVEGAS",
                "laps": 1,
                "competitors": [{
                  "id": "player",
                  "driver_id": "default",
                  "name": "Player",
                  "team_id": "player-team",
                  "is_player": true,
                  "tuning": {
                    "engine_points": 25,
                    "cooling_points": 25,
                    "aero_points": 25,
                    "chassis_points": 25,
                    "downforce_slider": 0.5,
                    "gear_ratio_slider": 0.5
                  },
                  "budget_cap": 100
                }],
                "vehicle_id": "f1_2026",
                "era": 6,
                "hz": 20
              }
            }' \
            --output /tmp/authority-attempt-response.json

          grep --fixed-strings \
            '"authorization_version":"pitgun.run-attempt-authorization/v1"' \
            /tmp/authority-attempt-response.json
          grep --fixed-strings \
            '"instruction_profile":{"id":"pitgun.racing-driver-instructions","version":"1.0.0","digest":"sha256:508bf37c0092836d18660e5aa717344b2c563d04dd29b6ca426cf8b94e175aa3"}' \
            /tmp/authority-attempt-response.json
          grep --fixed-strings \
            '"boundary_granularity":"lap_start","max_events_per_session":64' \
            /tmp/authority-attempt-response.json

      - name: Build and push authority image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/pitgun-authority/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}
          build-args: |
            RUST_VERSION=1.89
          cache-from: type=gha,scope=pitgun-authority
          cache-to: type=gha,mode=max,scope=pitgun-authority

      - name: Publish image details
        if: github.event_name != 'pull_request'
        run: |
          echo "Image tag: ${{ steps.meta.outputs.image_tag }}"
          echo "Image digest: ${{ steps.push.outputs.digest }}"
