resources:
  jobs:
    bootstrap_job:
      name: pitgun-calibration-v1
      description: >-
        Bootstrap and validate the governed data plane used by deterministic
        Pitgun Racing calibration campaigns.
      max_concurrent_runs: 1
      performance_target: STANDARD
      parameters:
        - name: operation
          default: bootstrap
        - name: campaign_id
          default: bundle-smoke
      environments:
        - environment_key: serverless
          spec:
            environment_version: "4"
      tasks:
        - task_key: bootstrap_governed_tables
          description: Create the seven documented Delta tables idempotently.
          environment_key: serverless
          notebook_task:
            notebook_path: ../src/bootstrap_tables.py
            source: WORKSPACE
            base_parameters:
              operation: "{{job.parameters.operation}}"
              campaign_id: "{{job.parameters.campaign_id}}"
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              policies_schema: ${resources.schemas.policies.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
          timeout_seconds: 900
      tags:
        pitgun.domain: calibration
        pitgun.compute: serverless
        pitgun.version: v1

    runner_spike_job:
      name: pitgun-rust-runner-spike-v1
      description: >-
        Execute the packaged, content-addressed Pitgun Rust Racing runner on
        serverless compute without accepting arbitrary code or artifact URLs.
      max_concurrent_runs: 1
      performance_target: STANDARD
      parameters:
        - name: seed
          default: "42"
        - name: configuration_family
          default: balanced
      environments:
        - environment_key: serverless_runner
          spec:
            environment_version: "4"
            dependencies:
              - ../adapter/dist/*.whl
      tasks:
        - task_key: execute_packaged_racing
          description: Run the embedded Racing fixture through the native Pitgun CLI.
          environment_key: serverless_runner
          notebook_task:
            notebook_path: ../src/run_packaged_runner.py
            source: WORKSPACE
            base_parameters:
              seed: "{{job.parameters.seed}}"
              configuration_family: "{{job.parameters.configuration_family}}"
          timeout_seconds: 900
      tags:
        pitgun.domain: calibration
        pitgun.compute: serverless
        pitgun.runner: rust-native
        pitgun.version: v1

    opponent_audit_job:
      name: pitgun-racing-opponent-audit-v1
      description: >-
        Execute the immutable 180-run Racing V2 opponent audit, resume accepted
        run keys, persist governed Delta evidence, and report to MLflow.
      max_concurrent_runs: 1
      performance_target: STANDARD
      environments:
        - environment_key: serverless_opponent_audit
          spec:
            environment_version: "4"
            dependencies:
              - ../adapter/dist/*.whl
      tasks:
        - task_key: bootstrap_governed_tables
          description: Additively evolve and validate the existing governed tables.
          environment_key: serverless_opponent_audit
          notebook_task:
            notebook_path: ../src/bootstrap_tables.py
            source: WORKSPACE
            base_parameters:
              operation: bootstrap
              campaign_id: racing-opponent-audit-2026-v1
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              policies_schema: ${resources.schemas.policies.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
          timeout_seconds: 900
        - task_key: execute_opponent_audit
          description: Execute and reconcile all 180 immutable explicit run keys.
          depends_on:
            - task_key: bootstrap_governed_tables
          environment_key: serverless_opponent_audit
          notebook_task:
            notebook_path: ../src/execute_opponent_audit.py
            source: WORKSPACE
            base_parameters:
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
          timeout_seconds: 7200
      tags:
        pitgun.domain: calibration
        pitgun.compute: serverless
        pitgun.runner: rust-native
        pitgun.campaign: racing-opponent-audit-v1
        pitgun.promotion: human-review-required

    reference_campaign_job:
      name: pitgun-racing-reference-campaign-v1
      description: >-
        Bootstrap governed tables, execute the immutable nine-run Racing
        campaign, merge evidence idempotently into Delta, and report to MLflow.
      max_concurrent_runs: 1
      performance_target: STANDARD
      environments:
        - environment_key: serverless_campaign
          spec:
            environment_version: "4"
            dependencies:
              - ../adapter/dist/*.whl
      tasks:
        - task_key: bootstrap_governed_tables
          description: Create or additively evolve the governed Delta tables.
          environment_key: serverless_campaign
          notebook_task:
            notebook_path: ../src/bootstrap_tables.py
            source: WORKSPACE
            base_parameters:
              operation: bootstrap
              campaign_id: racing-reference-it-1922-2026-v1
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              policies_schema: ${resources.schemas.policies.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
          timeout_seconds: 900
        - task_key: execute_reference_campaign
          description: Execute missing runs and reconcile the immutable campaign.
          depends_on:
            - task_key: bootstrap_governed_tables
          environment_key: serverless_campaign
          notebook_task:
            notebook_path: ../src/execute_reference_campaign.py
            source: WORKSPACE
            base_parameters:
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
              campaign_name: racing-reference-v1
          timeout_seconds: 1800
      tags:
        pitgun.domain: calibration
        pitgun.compute: serverless
        pitgun.runner: rust-native
        pitgun.campaign: racing-reference-v1

    circuit_sweep_job:
      name: pitgun-racing-circuit-sweep-v1
      description: >-
        Execute the immutable 105-run Racing setup sweep across five governed
        circuit archetypes and report circuit-aware evidence to Delta and MLflow.
      max_concurrent_runs: 1
      performance_target: STANDARD
      environments:
        - environment_key: serverless_circuit_sweep
          spec:
            environment_version: "4"
            dependencies:
              - ../adapter/dist/*.whl
      tasks:
        - task_key: bootstrap_governed_tables
          description: Create or additively evolve the governed Delta tables.
          environment_key: serverless_circuit_sweep
          notebook_task:
            notebook_path: ../src/bootstrap_tables.py
            source: WORKSPACE
            base_parameters:
              operation: bootstrap
              campaign_id: racing-circuit-sweep-2026-v1
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              policies_schema: ${resources.schemas.policies.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
          timeout_seconds: 900
        - task_key: execute_circuit_sweep
          description: Execute missing runs and reconcile all 105 immutable natural keys.
          depends_on:
            - task_key: bootstrap_governed_tables
          environment_key: serverless_circuit_sweep
          notebook_task:
            notebook_path: ../src/execute_reference_campaign.py
            source: WORKSPACE
            base_parameters:
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
              campaign_name: racing-circuit-sweep-v1
          timeout_seconds: 3600
      tags:
        pitgun.domain: calibration
        pitgun.compute: serverless
        pitgun.runner: rust-native
        pitgun.campaign: racing-circuit-sweep-v1

    candidate_validation_job:
      name: pitgun-racing-aero-candidate-validation-v1
      description: >-
        Compare the historical and calibrated aerodynamic responses through
        210 immutable experimental executions, Delta evidence, and MLflow.
      max_concurrent_runs: 1
      performance_target: STANDARD
      environments:
        - environment_key: serverless_candidate_validation
          spec:
            environment_version: "4"
            dependencies:
              - ../adapter/dist/*.whl
      tasks:
        - task_key: bootstrap_governed_tables
          description: Create or additively evolve the governed Delta tables.
          environment_key: serverless_candidate_validation
          notebook_task:
            notebook_path: ../src/bootstrap_tables.py
            source: WORKSPACE
            base_parameters:
              operation: bootstrap
              campaign_id: racing-aero-candidate-validation-2026-v1
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              policies_schema: ${resources.schemas.policies.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
          timeout_seconds: 900
        - task_key: execute_candidate_validation
          description: Execute and reconcile all 210 immutable experimental keys.
          depends_on:
            - task_key: bootstrap_governed_tables
          environment_key: serverless_candidate_validation
          notebook_task:
            notebook_path: ../src/execute_candidate_validation.py
            source: WORKSPACE
            base_parameters:
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
              campaign_name: racing-aero-candidate-validation-v1
          timeout_seconds: 3600
      tags:
        pitgun.domain: calibration
        pitgun.compute: serverless
        pitgun.runner: rust-native-experimental
        pitgun.campaign: racing-aero-candidate-validation-v1
        pitgun.promotion: human-review-required

    candidate_review_job:
      name: pitgun-racing-aero-candidate-review-v1
      description: >-
        Review exact experimental Delta snapshots, separate setup signal from
        seed noise, and issue a non-automatic PROMOTE, REFINE, or REJECT decision.
      max_concurrent_runs: 1
      performance_target: STANDARD
      environments:
        - environment_key: serverless_candidate_review
          spec:
            environment_version: "4"
            dependencies:
              - ../adapter/dist/*.whl
      tasks:
        - task_key: review_candidate_evidence
          description: Apply the immutable physical-coherence and robustness policy.
          environment_key: serverless_candidate_review
          notebook_task:
            notebook_path: ../src/review_candidate_evidence.py
            source: WORKSPACE
            base_parameters:
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              campaign_name: racing-aero-candidate-validation-v1
              review_policy_name: racing-aero-candidate-review-v1
              experimental_runs_table_version: "1"
              experimental_metrics_table_version: "1"
          timeout_seconds: 900
      tags:
        pitgun.domain: calibration
        pitgun.compute: serverless
        pitgun.review: racing-aero-candidate-review-v1
        pitgun.promotion: human-review-required

    reference_policy_job:
      name: pitgun-racing-reference-policy-v1
      description: >-
        Select a reviewed opponent-policy proposal reproducibly from exact
        Delta snapshots. Publication remains a separate human-approved action.
      max_concurrent_runs: 1
      performance_target: STANDARD
      environments:
        - environment_key: serverless_policy
          spec:
            environment_version: "4"
            dependencies:
              - ../adapter/dist/*.whl
      tasks:
        - task_key: select_reference_policy
          description: Apply validity, fairness, robustness, and diversity gates.
          environment_key: serverless_policy
          notebook_task:
            notebook_path: ../src/select_reference_opponent_policy.py
            source: WORKSPACE
            base_parameters:
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              policies_schema: ${resources.schemas.policies.name}
              campaigns_table_version: "3"
              runs_table_version: "2"
              metrics_table_version: "1"
          timeout_seconds: 900
      tags:
        pitgun.domain: calibration
        pitgun.compute: serverless
        pitgun.policy: racing-opponents-reference-v1
        pitgun.version: v1
