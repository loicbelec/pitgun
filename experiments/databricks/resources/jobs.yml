resources:
  jobs:
    bootstrap_job:
      name: pitgun-calibration-v1
      description: >-
        Bootstrap and validate the governed data plane used by deterministic
        Pitgun Racing calibration campaigns.
      max_concurrent_runs: 1
      performance_target: STANDARD
      parameters:
        - name: operation
          default: bootstrap
        - name: campaign_id
          default: bundle-smoke
      environments:
        - environment_key: serverless
          spec:
            environment_version: "4"
      tasks:
        - task_key: bootstrap_governed_tables
          description: Create the seven documented Delta tables idempotently.
          environment_key: serverless
          notebook_task:
            notebook_path: ../src/bootstrap_tables.py
            source: WORKSPACE
            base_parameters:
              operation: "{{job.parameters.operation}}"
              campaign_id: "{{job.parameters.campaign_id}}"
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              policies_schema: ${resources.schemas.policies.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
          timeout_seconds: 900
      tags:
        pitgun.domain: calibration
        pitgun.compute: serverless
        pitgun.version: v1

    runner_spike_job:
      name: pitgun-rust-runner-spike-v1
      description: >-
        Execute the packaged, content-addressed Pitgun Rust Racing runner on
        serverless compute without accepting arbitrary code or artifact URLs.
      max_concurrent_runs: 1
      performance_target: STANDARD
      parameters:
        - name: seed
          default: "42"
        - name: configuration_family
          default: balanced
      environments:
        - environment_key: serverless_runner
          spec:
            environment_version: "4"
            dependencies:
              - ../adapter/dist/*.whl
      tasks:
        - task_key: execute_packaged_racing
          description: Run the embedded Racing fixture through the native Pitgun CLI.
          environment_key: serverless_runner
          notebook_task:
            notebook_path: ../src/run_packaged_runner.py
            source: WORKSPACE
            base_parameters:
              seed: "{{job.parameters.seed}}"
              configuration_family: "{{job.parameters.configuration_family}}"
          timeout_seconds: 900
      tags:
        pitgun.domain: calibration
        pitgun.compute: serverless
        pitgun.runner: rust-native
        pitgun.version: v1

    opponent_audit_job:
      name: pitgun-racing-opponent-audit-v1
      description: >-
        Execute the immutable 180-run Racing V2 opponent audit, resume accepted
        run keys, persist governed Delta evidence, and report to MLflow.
      max_concurrent_runs: 1
      performance_target: STANDARD
      environments:
        - environment_key: serverless_opponent_audit
          spec:
            environment_version: "4"
            dependencies:
              - ../adapter/dist/*.whl
      tasks:
        - task_key: bootstrap_governed_tables
          description: Additively evolve and validate the existing governed tables.
          environment_key: serverless_opponent_audit
          notebook_task:
            notebook_path: ../src/bootstrap_tables.py
            source: WORKSPACE
            base_parameters:
              operation: bootstrap
              campaign_id: racing-opponent-audit-2026-v1
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              policies_schema: ${resources.schemas.policies.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
          timeout_seconds: 900
        - task_key: execute_opponent_audit
          description: Execute and reconcile all 180 immutable explicit run keys.
          depends_on:
            - task_key: bootstrap_governed_tables
          environment_key: serverless_opponent_audit
          notebook_task:
            notebook_path: ../src/execute_opponent_audit.py
            source: WORKSPACE
            base_parameters:
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
          timeout_seconds: 7200
      tags:
        pitgun.domain: calibration
        pitgun.compute: serverless
        pitgun.runner: rust-native
        pitgun.campaign: racing-opponent-audit-v1
        pitgun.promotion: human-review-required

    opponent_diagnosis_job:
      name: pitgun-racing-opponent-diagnosis-v1
      description: >-
        Decompose exact completed opponent-audit snapshots into setup,
        strategy, progression, and diversity evidence without selecting policy.
      max_concurrent_runs: 1
      performance_target: STANDARD
      parameters:
        - name: campaigns_table_version
          default: "19"
        - name: runs_table_version
          default: "5"
        - name: metrics_table_version
          default: "3"
      environments:
        - environment_key: serverless_opponent_diagnosis
          spec:
            environment_version: "4"
            dependencies:
              - ../adapter/dist/*.whl
      tasks:
        - task_key: diagnose_opponent_audit
          description: Read only explicitly pinned Delta evidence and log a diagnosis.
          environment_key: serverless_opponent_diagnosis
          notebook_task:
            notebook_path: ../src/diagnose_opponent_audit.py
            source: WORKSPACE
            base_parameters:
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              campaigns_table_version: "{{job.parameters.campaigns_table_version}}"
              runs_table_version: "{{job.parameters.runs_table_version}}"
              metrics_table_version: "{{job.parameters.metrics_table_version}}"
          timeout_seconds: 900
      tags:
        pitgun.domain: calibration
        pitgun.compute: serverless
        pitgun.analysis: racing-opponent-diagnosis-v1
        pitgun.promotion: forbidden

    strategy_effect_job:
      name: pitgun-racing-strategy-effect-v1
      description: >-
        Execute 45 exact controlled strategy pairs, persist governed evidence,
        and report causal late-minus-balanced effects without selecting policy.
      max_concurrent_runs: 1
      performance_target: STANDARD
      environments:
        - environment_key: serverless_strategy_effect
          spec:
            environment_version: "4"
            dependencies:
              - ../adapter/dist/*.whl
      tasks:
        - task_key: bootstrap_governed_tables
          description: Validate and additively evolve the governed tables.
          environment_key: serverless_strategy_effect
          notebook_task:
            notebook_path: ../src/bootstrap_tables.py
            source: WORKSPACE
            base_parameters:
              operation: bootstrap
              campaign_id: racing-strategy-effect-2026-v1
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              policies_schema: ${resources.schemas.policies.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
          timeout_seconds: 900
        - task_key: execute_strategy_effect
          description: Execute or resume all 90 immutable strategy run keys.
          depends_on:
            - task_key: bootstrap_governed_tables
          environment_key: serverless_strategy_effect
          notebook_task:
            notebook_path: ../src/execute_strategy_effect.py
            source: WORKSPACE
            base_parameters:
              catalog_name: ${var.catalog_name}
              calibration_schema: ${resources.schemas.calibration.name}
              experiment_id: ${resources.experiments.calibration_experiment.id}
          timeout_seconds: 3600
      tags:
        pitgun.domain: calibration
        pitgun.compute: serverless
        pitgun.campaign: racing-strategy-effect-v1
        pitgun.causal-experiment: "true"
        pitgun.promotion: forbidden

